<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Investissements</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --border: #232f48;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --crypto-axis: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }
    
    .tabs-bar-container { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .tabs-bar-container::-webkit-scrollbar { display: none; }
    .tab-item { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tab-item.active { background: var(--border); color: var(--accent); border-color: var(--accent); }
    .tab-actions-btn { background: transparent; border: none; color: inherit; font-size: 0.75rem; cursor: pointer; padding: 0 4px; }
    .btn-add-tab { background: var(--card); border: 1px dashed var(--border); color: var(--accent); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 800; cursor: pointer; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    
    .header-val { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
    .gain { font-size: 0.9rem; font-weight: 600; margin-top: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    
    .row-flex { display: flex; justify-content: space-between; align-items: center; }
    
    .pocket-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
    .pocket-title { font-size: 0.85rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .time-selector { display: flex; gap: 6px; margin-bottom: 10px; }
    .time-btn { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 6px 0; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .time-btn.active { background: var(--accent); color: #0b0f19; border-color: var(--accent); }

    .chart-container { position: relative; height: 230px; width: 100%; }
    .filters-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .filter-chip { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; background: var(--bg); padding: 4px 8px; border-radius: 20px; border: 1.5px solid var(--border); cursor: pointer; font-weight: 600; }
    .filter-chip input { cursor: pointer; margin: 0; }
    
    .item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .item-name { font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; }
    .account-badge { font-size: 0.65rem; background: var(--border); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 2px; }
    .item-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.35; }
    .item-right { text-align: right; font-size: 0.85rem; }
    
    .actions-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn-action { background: transparent; border: none; font-size: 0.75rem; cursor: pointer; padding: 2px 4px; font-weight: 600; }
    .btn-del { color: var(--red); }

    .btn { background: var(--accent); color: #0b0f19; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; width: 100%; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
    .btn-primary-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; font-weight: 700; border: none; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; backdrop-filter: blur(2px); }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 440px; padding: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .btn-close { background: transparent; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; font-weight: 700; }
    
    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); margin-bottom: 10px; font-size: 0.85rem; }
    .error-box { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--red); color: var(--red); padding: 10px; border-radius: 8px; font-size: 0.8rem; display: none; margin-bottom: 10px; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <div class="tabs-bar-container" id="tabsContainer"></div>
  <input type="file" id="importFileInput" accept=".json,application/json,text/plain" style="display:none;" onchange="handleImportFile(event)">

  <!-- Synthèse du portefeuille -->
  <div class="card">
    <div class="row-flex">
      <span style="font-size:0.8rem; color:var(--muted);">Valorisation Totale <span id="lastUpdate" style="font-size:0.75rem;">(Dernière MàJ : --:--)</span></span>
      <button class="btn" id="refreshBtn" style="width:auto; padding:4px 10px; font-size:0.75rem;" onclick="refreshAll()">Actualiser</button>
    </div>
    <div class="header-val" id="totalValue">0,00 €</div>
    <div class="gain" id="totalGain">Achat : 0,00 € • 0,00 € (0.00%)</div>
  </div>

  <!-- TABLEAU DU HAUT : Le Global (Stock Calculé, sans boutons) -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span style="font-size:0.85rem; font-weight:600; color:var(--muted);">Détail du Portefeuille (Stock Global)</span>
    </div>
    <div id="pocketsGrid" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </div>

  <!-- Graphique -->
  <div class="card">
    <div class="time-selector">
      <button class="time-btn" onclick="setTimeframe('1J', this)">1J</button>
      <button class="time-btn active" onclick="setTimeframe('1S', this)">1S</button>
      <button class="time-btn" onclick="setTimeframe('1M', this)">1M</button>
      <button class="time-btn" onclick="setTimeframe('6M', this)">6M</button>
      <button class="time-btn" onclick="setTimeframe('1A', this)">1A</button>
      <button class="time-btn" onclick="setTimeframe('ALL', this)">Tout</button>
    </div>
    <div id="chartError" class="error-box"></div>
    <div id="chartLoading" style="display:none; font-size:0.75rem; color:var(--accent); margin-bottom:8px; font-weight:600;">⏳ Recherche des cours en cours...</div>
    <div class="filters-container" id="chartFilters"></div>
    <div class="chart-container">
      <canvas id="portfolioChart"></canvas>
    </div>
  </div>

  <!-- TABLEAU DU BAS : Historique des opérations (Avec Boutons Modifier/Supprimer) -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
      <span style="font-size:0.85rem; font-weight:600; color:var(--muted);">Historique des Opérations</span>
      <div style="display:flex; gap:6px;">
        <button class="btn-primary-sm" style="background:var(--green); color:#fff;" onclick="openBuyModal()">+ Acheter</button>
        <button class="btn-primary-sm" style="background:var(--red); color:#fff;" onclick="openSellModal()">Vendre / Arbitrer</button>
      </div>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Modales Gestion Profil -->
<div class="modal-overlay" id="addProfileModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Nouveau portefeuille</span>
      <button class="btn-close" onclick="closeModal('addProfileModal')">✕</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
      <button class="btn" onclick="promptNewProfileName()">1. Créer un portefeuille vierge</button>
      <button class="btn btn-secondary" onclick="triggerFileImport()">2. Importer un fichier JSON</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="tabMenuModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="tabMenuTitle">Options du portefeuille</span>
      <button class="btn-close" onclick="closeModal('tabMenuModal')">✕</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
      <button class="btn btn-secondary" onclick="actionRenameProfile()">✏️ Renommer ce portefeuille</button>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="actionMoveProfile(-1)">◀ Déplacer à gauche</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="actionMoveProfile(1)">Déplacer à droite ▶</button>
      </div>
      <button class="btn btn-secondary" onclick="actionExportSingle()">📤 Exporter CE profil (.json)</button>
      <button class="btn btn-secondary" onclick="actionExportAll()">💾 Sauvegarde globale de TOUS les profils (.json)</button>
      <button class="btn btn-danger" style="margin-top:4px;" onclick="actionDeleteProfile()">🗑️ Supprimer ce profil</button>
    </div>
  </div>
</div>

<!-- Modale ACHAT / MODIFICATION D'ACHAT -->
<div class="modal-overlay" id="buyModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="buyModalTitle">Nouvel Achat / Dépôt</span>
      <button class="btn-close" onclick="closeModal('buyModal')">✕</button>
    </div>
    
    <label>Actif acheté</label>
    <select id="buyAssetType">
      <option value="bourse-sp500">PSP5 (S&P 500)</option>
      <option value="bourse-nasdaq">Nasdaq</option>
      <option value="crypto-bitcoin">Bitcoin (BTC)</option>
      <option value="crypto-ethereum">Ethereum (ETH)</option>
      <option value="crypto-solana">Solana (SOL)</option>
      <option value="crypto-hype">Hyperliquid (HYPE)</option>
      <option value="fiat-eur">Dépôt Euros (€ - Liquidités)</option>
      <option value="manual">Autre actif (Personnalisé)</option>
    </select>
    
    <input type="text" id="buyAssetName" placeholder="Nom personnalisé" style="display:none;">

    <label>Compte / Poche fiscale</label>
    <select id="buyAssetAccount">
      <option value="PEA">PEA</option>
      <option value="CTO">CTO</option>
      <option value="Crypto">Wallet Crypto</option>
      <option value="AV">Assurance-Vie (AV)</option>
      <option value="Autre">Autre compte</option>
    </select>
    
    <label>Date de l'achat</label>
    <input type="date" id="buyDate">
    
    <label>Quantité achetée (Parts / Jetons)</label>
    <input type="number" id="buyQty" placeholder="Ex: 100 ou 0.15" step="any">
    
    <label>Prix d'Achat Unitaire (PRU) en €</label>
    <input type="number" id="buyPru" placeholder="Ex: 58.18 (Mettre 1 si dépôt €)" step="any">
    
    <div id="buyManualPriceContainer" style="display:none;">
      <label>Cours actuel (€ - Actif personnalisé)</label>
      <input type="number" id="buyManualPrice" placeholder="Ex: 120.50" step="any">
    </div>
    
    <div style="display:flex; gap:8px; margin-top:6px;">
      <button class="btn" id="buyModalSubmitBtn" onclick="executeBuy()">Enregistrer</button>
      <button class="btn btn-secondary" onclick="closeModal('buyModal')">Annuler</button>
    </div>
  </div>
</div>

<!-- Modale VENTE / ARBITRAGE (ET MODIFICATION) -->
<div class="modal-overlay" id="sellModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="sellModalTitle">Vendre / Arbitrer une position</span>
      <button class="btn-close" onclick="closeModal('sellModal')">✕</button>
    </div>

    <label>Actif possédé à vendre</label>
    <select id="sellSourceId"></select>
    
    <label>Date de l'opération</label>
    <input type="date" id="sellDate">

    <label>Quantité totale de parts vendues</label>
    <input type="number" id="sellQty" placeholder="Ex: 5" step="any">

    <label>Prix d'exécution (Prix de vente unitaire en €)</label>
    <input type="number" id="sellPru" placeholder="Ex: 65000" step="any">

    <div style="margin: 16px 0; border-top: 1px dashed var(--border);"></div>

    <label style="color:var(--accent); font-weight:700;">Destination des fonds (Que reçois-tu ?)</label>
    <select id="sellTargetType" onchange="toggleSellTarget()">
      <option value="fiat-eur">Euros (€ - Conservation en Cash)</option>
      <option value="crypto-hype">Hyperliquid (HYPE)</option>
      <option value="crypto-bitcoin">Bitcoin (BTC)</option>
      <option value="crypto-solana">Solana (SOL)</option>
      <option value="crypto-ethereum">Ethereum (ETH)</option>
      <option value="bourse-sp500">PSP5 (S&P 500)</option>
      <option value="bourse-nasdaq">Nasdaq</option>
    </select>

    <div id="sellTargetQtyContainer" style="display:none;">
      <label>Quantité reçue de ce nouvel actif</label>
      <input type="number" id="sellTargetQty" placeholder="Ex: 15.2 parts" step="any">
    </div>

    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" id="sellModalSubmitBtn" onclick="executeSell()">Valider la transaction</button>
      <button class="btn btn-secondary" onclick="closeModal('sellModal')">Annuler</button>
    </div>
  </div>
</div>

<script>
  let appState = JSON.parse(localStorage.getItem('my_invest_app_state') || 'null');
  let editingIndex = -1;

  if (!appState) {
    let oldSinglePortfolio = JSON.parse(localStorage.getItem('my_portfolio') || 'null');
    appState = { activeId: 'prof_default', profiles: [{ id: 'prof_default', name: 'Portefeuille 1', portfolio: oldSinglePortfolio || [] }] };
    saveAppState();
  }

  // Rétrocompatibilité & Renommage automatique de S&P 500 vers PSP5
  appState.profiles.forEach(p => {
    if (p.portfolio) {
      p.portfolio.forEach(tx => { 
        if (!tx.type) tx.type = 'BUY'; 
        if (tx.id === 'bourse-sp500' && (tx.name === 'S&P 500' || tx.name === 'S&P 500 (PSP5)')) tx.name = 'PSP5';
      });
    }
  });
  saveAppState();

  let chartInstance = null;
  let currentTimeframe = '1S';
  let activeFilters = { 'TOTAL': true };
  const palette = ['#38bdf8', '#f59e0b', '#ec4899', '#10b981', '#a855f7', '#06b6d4', '#eab308', '#f97316'];

  function saveAppState() { localStorage.setItem('my_invest_app_state', JSON.stringify(appState)); }
  function getActiveProfile() { return appState.profiles.find(p => p.id === appState.activeId) || appState.profiles[0]; }

  // 1. MOTEUR D'INVENTAIRE : Calcule le Stock Global PMP pour le tableau du haut
  function getCurrentInventory(upToDate = null) {
    let inv = {};
    let rawPortfolio = getActiveProfile().portfolio.slice().sort((a,b) => new Date(a.date) - new Date(b.date));

    rawPortfolio.forEach(tx => {
      if (upToDate && new Date(tx.date).setHours(0,0,0,0) > upToDate) return;

      let key = tx.id + '|' + tx.account;
      if (!inv[key]) {
        inv[key] = { id: tx.id, name: tx.name, account: tx.account, qty: 0, totalCost: 0, pmp: 0, manualPrice: tx.manualPrice };
      }

      if (tx.type === 'BUY') {
        inv[key].qty += tx.qty;
        inv[key].totalCost += (tx.qty * tx.pru);
      } 
      else if (tx.type === 'SELL') {
        let prop = inv[key].qty > 0 ? (tx.qty / inv[key].qty) : 0;
        inv[key].qty -= tx.qty;
        inv[key].totalCost -= (inv[key].totalCost * prop);
        
        let tKey = 'fiat-eur|' + tx.account;
        if (!inv[tKey]) inv[tKey] = { id: 'fiat-eur', name: 'Euros (€)', account: tx.account, qty: 0, totalCost: 0, pmp: 1 };
        inv[tKey].qty += (tx.qty * tx.pru);
        inv[tKey].totalCost += (tx.qty * tx.pru);
      } 
      else if (tx.type === 'SWAP') {
        let prop = inv[key].qty > 0 ? (tx.qty / inv[key].qty) : 0;
        inv[key].qty -= tx.qty;
        inv[key].totalCost -= (inv[key].totalCost * prop);

        let tAcct = tx.targetId.startsWith('crypto-') ? 'Crypto' : tx.account;
        let tKey = tx.targetId + '|' + tAcct;
        if (!inv[tKey]) inv[tKey] = { id: tx.targetId, name: tx.targetName, account: tAcct, qty: 0, totalCost: 0, pmp: 0, manualPrice: null };
        inv[tKey].qty += tx.targetQty;
        inv[tKey].totalCost += (tx.qty * tx.pru);
      }

      if (inv[key].qty <= 0.00000001) { inv[key].qty = 0; inv[key].totalCost = 0; }
      inv[key].pmp = inv[key].qty > 0 ? inv[key].totalCost / inv[key].qty : 0;
    });

    return Object.values(inv).filter(i => i.qty > 0);
  }

  function getChartGroups() {
    let txs = getActiveProfile().portfolio;
    const groups = [];
    const addGroup = (id, name, account) => {
       if (!groups.find(x => x.id === id && x.account === account)) groups.push({ id, name, account });
    };
    txs.forEach(tx => {
       addGroup(tx.id, tx.name, tx.account);
       if (tx.type === 'SWAP') {
          let tAcct = tx.targetId.startsWith('crypto-') ? 'Crypto' : tx.account;
          addGroup(tx.targetId, tx.targetName, tAcct);
       }
       if (tx.type === 'SELL') addGroup('fiat-eur', 'Euros (€)', tx.account);
    });
    return groups;
  }

  function formatDuration(dateStr) {
    if (!dateStr) return '';
    const buyDate = new Date(dateStr); const now = new Date();
    if (isNaN(buyDate.getTime())) return '';
    let years = now.getFullYear() - buyDate.getFullYear();
    let months = now.getMonth() - buyDate.getMonth();
    if (months < 0) { years -= 1; months += 12; }
    if (years <= 0 && months <= 0) return `${Math.floor(Math.max(now - buyDate, 0) / (1000 * 60 * 60 * 24))} j`;
    return years > 0 ? `${years} an${years > 1 ? 's' : ''} et ${months} mois` : `${months} mois`;
  }

  /* Rendu UI */
  function renderTabs() {
    const container = document.getElementById('tabsContainer'); container.innerHTML = '';
    appState.profiles.forEach((prof, idx) => {
      const tab = document.createElement('div');
      tab.className = `tab-item ${prof.id === appState.activeId ? 'active' : ''}`;
      tab.onclick = (e) => { if (e.target.tagName !== 'BUTTON') { appState.activeId = prof.id; saveAppState(); renderTabs(); refreshAll(); } };
      tab.innerHTML = `<span>${prof.name}</span><button class="tab-actions-btn" onclick="openTabMenuModal(event, ${idx})">⋮</button>`;
      container.appendChild(tab);
    });
    const addBtn = document.createElement('button'); addBtn.className = 'btn-add-tab'; addBtn.innerText = '+';
    addBtn.onclick = () => openModal('addProfileModal'); container.appendChild(addBtn);
  }

  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { 
    document.getElementById(id).style.display = 'none'; 
    if (id === 'buyModal' || id === 'sellModal') editingIndex = -1;
  }

  function promptNewProfileName() {
    closeModal('addProfileModal');
    setTimeout(() => {
      const name = prompt("Nom du portefeuille :", `Portefeuille ${appState.profiles.length + 1}`);
      if (!name || !name.trim()) return;
      appState.profiles.push({ id: 'prof_' + Date.now(), name: name.trim(), portfolio: [] });
      appState.activeId = 'prof_' + Date.now(); saveAppState(); renderTabs(); refreshAll();
    }, 100);
  }

  function triggerFileImport() { closeModal('addProfileModal'); document.getElementById('importFileInput').click(); }

  let selectedTabIdx = -1;
  function openTabMenuModal(e, index) {
    e.stopPropagation(); selectedTabIdx = index;
    document.getElementById('tabMenuTitle').innerText = `Options : ${appState.profiles[index].name}`;
    openModal('tabMenuModal');
  }

  function actionRenameProfile() {
    closeModal('tabMenuModal');
    setTimeout(() => {
      const newName = prompt("Nouveau nom :", appState.profiles[selectedTabIdx].name);
      if (newName && newName.trim()) { appState.profiles[selectedTabIdx].name = newName.trim(); saveAppState(); renderTabs(); }
    }, 100);
  }
  function actionMoveProfile(dir) {
    const t = selectedTabIdx + dir;
    if (t >= 0 && t < appState.profiles.length) {
      const temp = appState.profiles[t]; appState.profiles[t] = appState.profiles[selectedTabIdx]; appState.profiles[selectedTabIdx] = temp;
      saveAppState(); renderTabs(); closeModal('tabMenuModal');
    }
  }
  function actionExportSingle() {
    closeModal('tabMenuModal');
    const blob = new Blob([JSON.stringify({ type: 'single_profile', data: appState.profiles[selectedTabIdx] }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `portefeuille_${appState.profiles[selectedTabIdx].name}_${new Date().toISOString().split('T')[0]}.json`; a.click();
  }
  function actionExportAll() {
    closeModal('tabMenuModal');
    const blob = new Blob([JSON.stringify({ type: 'all_profiles', data: appState }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `portefeuilles_TOTAL_${new Date().toISOString().split('T')[0]}.json`; a.click();
  }
  function actionDeleteProfile() {
    closeModal('tabMenuModal');
    if (appState.profiles.length === 1) return alert("Impossible de supprimer le seul profil.");
    if (confirm(`Supprimer définitivement "${appState.profiles[selectedTabIdx].name}" ?`)) {
      appState.profiles.splice(selectedTabIdx, 1);
      if (!appState.profiles.find(p=>p.id === appState.activeId)) appState.activeId = appState.profiles[0].id;
      saveAppState(); renderTabs(); refreshAll();
    }
  }

  function handleImportFile(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported.type === 'all_profiles') {
          if (confirm("Remplacer tous les profils ?")) { appState = imported.data; saveAppState(); renderTabs(); refreshAll(); }
        } else {
          let incomingPositions = imported.type === 'single_profile' ? imported.data.portfolio : imported;
          let incomingName = imported.type === 'single_profile' ? imported.data.name : "Profil importé";
          const newId = 'prof_' + Date.now();
          appState.profiles.push({ id: newId, name: incomingName, portfolio: incomingPositions });
          appState.activeId = newId; saveAppState(); renderTabs(); refreshAll();
        }
      } catch (err) { alert("Erreur d'import : " + err.message); }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

    const item = getActiveProfile().portfolio[originalTxIndex];
    
    if (item.type === 'SELL' || item.type === 'SWAP') {
      document.getElementById('sellModalTitle').innerText = "Modifier la transaction";
      document.getElementById('sellModalSubmitBtn').innerText = "Mettre à jour";
      
      let sel = document.getElementById('sellSourceId');
      sel.innerHTML = `<option value="${item.id}|${item.account}" data-name="${item.name}">${item.name} [${item.account}]</option>`;
      
      document.getElementById('sellDate').value = item.date;
      document.getElementById('sellQty').value = item.qty;
      document.getElementById('sellPru').value = item.pru;
      document.getElementById('sellTargetType').value = item.targetId;

          document.getElementById('sellTargetQty').value = item.targetQty;

  function executeBuy() {
    const type = document.getElementById('buyAssetType').value;
    const account = type.startsWith('crypto-') ? 'Crypto' : document.getElementById('buyAssetAccount').value;
    const qty = parseFloat(document.getElementById('buyQty').value);
    const pru = parseFloat(document.getElementById('buyPru').value) || 0;
    const date = document.getElementById('buyDate').value || new Date().toISOString().split('T')[0];
    
    let name = document.getElementById('buyAssetType').options[document.getElementById('buyAssetType').selectedIndex].text.split('(')[0].trim();
    let manualPrice = null;

    if (type === 'manual') {
      name = document.getElementById('buyAssetName').value || 'Actif';
      manualPrice = parseFloat(document.getElementById('buyManualPrice').value) || 0;
    }

    if (!qty || isNaN(qty) || qty <= 0) return alert("Quantité requise et positive.");

    if (editingIndex > -1) {
      let existingType = getActiveProfile().portfolio[editingIndex].type || 'BUY';
      getActiveProfile().portfolio[editingIndex] = { type: existingType, id: type, name, account, qty, pru, date, manualPrice };
    } else {
      getActiveProfile().portfolio.push({ type: 'BUY', id: type, name, account, qty, pru, date, manualPrice });
    }
    
    saveAppState(); closeModal('buyModal'); refreshAll();
  }

  function toggleSellTarget() {
    let isFiat = document.getElementById('sellTargetType').value === 'fiat-eur';

  function executeSell() {
    let selEl = document.getElementById('sellSourceId');
    if(!selEl.value) return;
    let [srcId, srcAccount] = selEl.value.split('|');
    let srcName = selEl.options[selEl.selectedIndex].getAttribute('data-name');

    let qty = parseFloat(document.getElementById('sellQty').value);
    let pru = parseFloat(document.getElementById('sellPru').value);
    let targetId = document.getElementById('sellTargetType').value;
    let targetName = document.getElementById('sellTargetType').options[document.getElementById('sellTargetType').selectedIndex].text.split('(')[0].trim();
    let date = document.getElementById('sellDate').value || new Date().toISOString().split('T')[0];

    if (!qty || isNaN(qty) || qty <= 0) return alert("Quantité invalide.");
    if (!pru || isNaN(pru) || pru <= 0) return alert("Prix d'exécution invalide.");

    let targetQty = 0;
    if (targetId === 'fiat-eur') {
      targetQty = qty * pru;
    } else {
      targetQty = parseFloat(document.getElementById('sellTargetQty').value);
      if (!targetQty || isNaN(targetQty) || targetQty <= 0) return alert("Quantité reçue invalide.");
    }

    let txData = {
      type: targetId === 'fiat-eur' ? 'SELL' : 'SWAP',
      date: date, id: srcId, name: srcName, account: srcAccount, qty: qty, pru: pru,
      targetId: targetId, targetName: targetName, targetAccount: targetId.startsWith('crypto-') ? 'Crypto' : srcAccount, targetQty: targetQty
    };

    if (editingIndex > -1) {
      getActiveProfile().portfolio[editingIndex] = txData;
    } else {
      getActiveProfile().portfolio.push(txData);
    }

    saveAppState(); closeModal('sellModal'); refreshAll();
  }

  function deleteTx(index) {
    if (confirm("Supprimer définitivement cette transaction de l'historique ?")) {
      getActiveProfile().portfolio.splice(index, 1);
      saveAppState(); refreshAll();
    }
  }

  // APIs Finance
  const YAHOO_TICKERS = { 'bourse-sp500': 'PSP5.PA', 'bourse-nasdaq': 'PUUST.PA' };
  let yahooCache = {};
  const CORS_PROXIES = [(u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u), (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)];

  async function fetchJsonWithTimeout(url, timeoutMs) {
    const controller = new AbortController(); const id = setTimeout(() => controller.abort(), timeoutMs);
    try { const res = await fetch(url, { signal: controller.signal }); clearTimeout(id); if (res.ok) return await res.json(); } catch(e) { clearTimeout(id); } return null;
  }
  async function fetchJsonWithCorsFallback(url) {
    const direct = await fetchJsonWithTimeout(url, 3500); if (direct) return direct;
    for (let pass = 0; pass < 2; pass++) {
      for (const proxy of CORS_PROXIES) { const data = await fetchJsonWithTimeout(proxy(url), 5000); if (data) return data; }
    } return null;
  }
  function yahooRangeParams(tf) {
    switch (tf) {
      case '1J': return { range: '5d', interval: '15m' }; case '1S': return { range: '1mo', interval: '30m' };
      case '1M': return { range: '3mo', interval: '1d' }; case '6M': return { range: '6mo', interval: '1d' };
      case '1A': return { range: '1y', interval: '1d' }; default: return { range: '5y', interval: '1wk' };
    }
  }
  async function fetchYahooChart(ticker, range, interval) {
    const cacheKey = `${ticker}_${range}_${interval}`; if (yahooCache[cacheKey]) return yahooCache[cacheKey];
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=${range}&interval=${interval}`;
    const data = await fetchJsonWithCorsFallback(url); const result = data?.chart?.result?.[0]; if (!result) return null;
    const currentPrice = result.meta?.regularMarketPrice || null;
    const timestamps = result.timestamp || []; const closes = result.indicators?.quote?.[0]?.close || [];
    const history = timestamps.map((ts, i) => ({ timestamp: ts * 1000, price: closes[i] })).filter(p => p.price !== null && p.price !== undefined);
    const parsed = { currentPrice, history }; yahooCache[cacheKey] = parsed; return parsed;
  }
  async function fetchCryptoPrice(symbol) {
    let data = await fetchJsonWithTimeout(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`, 3000);
    if (data?.price) return parseFloat(data.price);
    data = await fetchJsonWithTimeout(`https://fapi.binance.com/fapi/v1/ticker/price?symbol=${symbol}`, 3000);
    if (data?.price) return parseFloat(data.price); return null;
  }
  async function fetchLivePrices() {
    let prices = { 'fiat-eur': 1.0 }; let eurPerUsdt = 1;
    try { const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=EURUSDT'); const d = await r.json(); if (d?.price) eurPerUsdt = 1 / parseFloat(d.price); } catch(e) {}
    try {
      const [b, e, s, h] = await Promise.all([fetchCryptoPrice('BTCEUR'), fetchCryptoPrice('ETHEUR'), fetchCryptoPrice('SOLEUR'), fetchCryptoPrice('HYPEUSDT')]);
      if (b) prices['crypto-bitcoin'] = b; if (e) prices['crypto-ethereum'] = e; if (s) prices['crypto-solana'] = s; if (h) prices['crypto-hype'] = h * eurPerUsdt;
    } catch(e) {}
    try { const sp = await fetchYahooChart(YAHOO_TICKERS['bourse-sp500'], '5d', '15m'); if (sp?.currentPrice) prices['bourse-sp500'] = sp.currentPrice; else if (sp?.history?.length > 0) prices['bourse-sp500'] = sp.history[sp.history.length - 1].price; } catch(e) {}
    return prices;
  }
  async function fetchMarketHistory(symbol, interval, limit) {
    try {
      const isFut = (symbol === 'HYPEUSDT');
      let url = isFut ? `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=${limit}` : `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      let res = await fetch(url); if (!res.ok && !isFut) res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
      if (!res.ok) return null; let data = await res.json(); if (!Array.isArray(data)) return null; return data.map(c => ({ timestamp: c[0], price: parseFloat(c[4]) }));
    } catch(e) { return null; }
  }
  function getMarketPriceAt(series, targetTs) {
    if (!series || !series.length) return null; let valid = series.filter(p => p.timestamp <= targetTs); return valid.length > 0 ? valid[valid.length - 1].price : series[0].price;
  }

  function setTimeframe(tf, btn) { currentTimeframe = tf; document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); buildRealChart(); }

  async function refreshAll() {
    const refreshBtn = document.getElementById('refreshBtn'); refreshBtn.disabled = true; refreshBtn.innerText = 'Actualisation...';
    try {
      const inventory = getCurrentInventory();
      const livePrices = await fetchLivePrices();
      let totalVal = 0, totalCostGlob = 0;

      inventory.forEach(item => {
        if (item.id === 'fiat-eur') {
           item.currentPrice = 1; item.val = item.qty; item.pnl = 0; item.pnlPct = 0;
        } else {
           item.currentPrice = livePrices[item.id] !== undefined ? livePrices[item.id] : item.manualPrice;
           if (item.currentPrice !== null) {
              item.val = item.qty * item.currentPrice;
              item.pnl = item.val - item.totalCost;
              item.pnlPct = item.totalCost > 0 ? (item.pnl / item.totalCost) * 100 : 0;
           } else {
              item.val = item.totalCost; item.pnl = 0; item.pnlPct = 0; item.hasError = true;
           }
        }
        totalVal += item.val; totalCostGlob += item.totalCost;
      });

      let totalPnl = totalVal - totalCostGlob; let totalPnlPct = totalCostGlob > 0 ? (totalPnl / totalCostGlob) * 100 : 0;
      const hasErrorGlob = inventory.some(i => i.hasError);
      
      document.getElementById('totalValue').innerText = `${totalVal.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})} ${hasErrorGlob ? '*' : ''}`;
      document.getElementById('totalGain').innerHTML = `<span style="color:var(--text); font-weight:600;">Achat : ${totalCostGlob.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})}</span> <span style="color:var(--muted); margin:0 4px;">•</span> <span class="${totalPnl >= 0 ? 'positive' : 'negative'}">${totalPnl >= 0 ? '+' : ''}${totalPnl.toFixed(2)} € (${totalPnlPct.toFixed(2)}%)</span>`;
      document.getElementById('lastUpdate').innerText = `(Dernière MàJ : ${new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})})`;

      renderPocketsSummary(inventory);
      renderHistory(livePrices);
      renderFilterChips();
      await buildRealChart();
    } finally { refreshBtn.disabled = false; refreshBtn.innerText = 'Actualiser'; }
  }

  // TABLEAU DU HAUT : STOCK GLOBAL (SANS BOUTONS, ALIGNEMENT STRICT)
  function renderPocketsSummary(inventory) {
    const grid = document.getElementById('pocketsGrid'); grid.innerHTML = '';
    if (inventory.length === 0) { grid.innerHTML = '<div style="text-align:center; color:var(--muted); font-size:0.8rem; padding:16px;">Aucune position actuelle.</div>'; return; }
    
    let accounts = [...new Set(inventory.map(i => i.account))];
    accounts.forEach(acc => {
      let items = inventory.filter(i => i.account === acc);
      let accTotal = items.reduce((sum, i) => sum + i.val, 0);
      
      let subLines = items.sort((a,b) => b.val - a.val).map(i => {
         let priceStr = i.hasError ? '<span style="color:var(--red);">Erreur API</span>' : `${i.currentPrice?.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})}`;
         let subText = i.id === 'fiat-eur' ? '' : `PRU : ${i.pmp.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})} • Cours : ${priceStr}`;
         let gainStr = i.id === 'fiat-eur' ? 'Cash' : `${i.pnl>=0?'+':''}${i.pnl.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})} (${i.pnlPct.toFixed(2)}%)`;
         let titleLine = i.id === 'fiat-eur' ? i.name : `${i.qty.toLocaleString('fr-FR', {maximumFractionDigits:6})} ${i.name}`;
         
         return `
           <div style="display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);">
             <div>
               <div style="font-weight:700; font-size:0.9rem; color:var(--text); margin-bottom:4px;">${titleLine}</div>
               <div style="font-size:0.75rem; color:var(--muted); line-height:1.4;">${subText}</div>
             </div>
             <div style="text-align:right;">
               <div style="display:flex; justify-content:flex-end; gap:4px; align-items:baseline; font-weight:700; font-size:0.9rem; color:var(--text); margin-bottom:4px; white-space: nowrap;">
                 ${i.id === 'fiat-eur' ? '' : `<span>${i.totalCost.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})} ➔</span>`}

             </div>

      }).join('');

      grid.innerHTML += `<div class="pocket-box"><div class="row-flex"><span class="pocket-title">${acc}</span><span style="font-weight:800; font-size:1.1rem;">${accTotal.toLocaleString('fr-FR', {style:'currency', currency:'EUR'})}</span></div>${subLines}</div>`;

    getChartGroups().forEach((g, index) => {
      const key = `group-${index}`; const color = palette[(index + 1) % palette.length];
      if (activeFilters[key] === undefined) activeFilters[key] = true;
      const accountBadge = g.account ? ` [${g.account}]` : '';
      container.innerHTML += `<label class="filter-chip" style="border-color:${color}; color:${color};"><input type="checkbox" ${activeFilters[key] ? 'checked' : ''} onchange="toggleFilter('${key}')">${g.name}${accountBadge}</label>`;
    });
  }

  function toggleFilter(key) { activeFilters[key] = !activeFilters[key]; buildRealChart(); }

  async function buildRealChart() {
    const errBox = document.getElementById('chartError'); const loadingEl = document.getElementById('chartLoading');
    errBox.style.display = 'none'; errBox.innerText = ''; loadingEl.style.display = 'block';

    try {
      const chartGroups = getChartGroups();
      if (chartGroups.length === 0) { if (chartInstance) chartInstance.destroy(); return; }

      let interval = '2h', limit = 84, labelFormat = { weekday: 'short', hour: '2-digit' };
      if (currentTimeframe === '1J') { interval = '30m'; limit = 48; labelFormat = { hour: '2-digit', minute: '2-digit' }; } 
      else if (currentTimeframe === '1S') { interval = '2h'; limit = 84; labelFormat = { weekday: 'short', hour: '2-digit' }; } 
      else if (currentTimeframe === '1M') { interval = '1d'; limit = 30; labelFormat = { day: '2-digit', month: '2-digit' }; } 
      else if (currentTimeframe === '6M') { interval = '1w'; limit = 26; labelFormat = { month: 'short' }; } 
      else if (currentTimeframe === '1A') { interval = '1w'; limit = 52; labelFormat = { month: 'short' }; } 
      else if (currentTimeframe === 'ALL') { interval = '1M'; limit = 120; labelFormat = { year: 'numeric', month: 'short' }; }

      const baseTimeline = await fetchMarketHistory('BTCEUR', interval, limit);
      if (!baseTimeline || baseTimeline.length === 0) { errBox.innerText = "⚠️ Historique indisponible."; errBox.style.display = 'block'; return; }

      let eurUsdtHist = await fetchMarketHistory('EURUSDT', interval, limit);
      let usdtToEur = (idx) => eurUsdtHist?.[idx]?.price ? 1 / eurUsdtHist[idx].price : 0.98;

      let histories = {};
      for (let g of chartGroups) {
         if (g.id === 'fiat-eur' || g.id === 'manual') continue;
         if (g.id.startsWith('crypto-')) {
             let sym = g.id === 'crypto-bitcoin' ? 'BTCEUR' : g.id === 'crypto-ethereum' ? 'ETHEUR' : g.id === 'crypto-solana' ? 'SOLEUR' : g.id === 'crypto-hype' ? 'HYPEUSDT' : null;
             if (sym) histories[g.id] = await fetchMarketHistory(sym, interval, limit);
         } else if (g.id.startsWith('bourse-')) {
             let tkr = YAHOO_TICKERS[g.id];
             let yParams = yahooRangeParams(currentTimeframe);
             let hData = await fetchYahooChart(tkr, yParams.range, yParams.interval);
             histories[g.id] = hData ? hData.history : null;
         }
      }

      let groupSeriesEur = chartGroups.map(() => new Array(baseTimeline.length).fill(0));
      let failedAssets = new Set();

      for (let t = 0; t < baseTimeline.length; t++) {
         let pointDate = new Date(baseTimeline[t].timestamp);
         let invAtT = getCurrentInventory(pointDate);
         
         invAtT.forEach(item => {
            let gIdx = chartGroups.findIndex(g => g.id === item.id && g.account === item.account);
            if (gIdx >= 0) {
               let priceEur = 1;
               if (item.id === 'fiat-eur') priceEur = 1;
               else if (item.id === 'manual') priceEur = item.manualPrice || 0;
               else {
                  let h = histories[item.id];
                  if (!h || h.length === 0) { failedAssets.add(item.name); return; }
                  priceEur = getMarketPriceAt(h, baseTimeline[t].timestamp) || 0;
                  if (item.id === 'crypto-hype') priceEur *= usdtToEur(t);
               }
               groupSeriesEur[gIdx][t] += item.qty * priceEur;
            }
         });
      }

      for (let i = 0; i < chartGroups.length; i++) {
         if (!groupSeriesEur[i].some(v => v > 0) && chartGroups[i].id !== 'fiat-eur' && chartGroups[i].id !== 'manual') {
            failedAssets.add(chartGroups[i].name); groupSeriesEur[i] = null;
         }
      }

      if (failedAssets.size > 0) { errBox.innerText = `⚠️ Historique de cours indisponible pour : ${Array.from(failedAssets).join(', ')}.`; errBox.style.display = 'block'; }

      const toPercent = (series) => {
        if (!series) return null; const firstValid = series.find(v => v > 0) || 1;
        return series.map(v => v === 0 ? 0 : ((v - firstValid) / firstValid) * 100);
      };

      let datasets = []; let hasCryptoOnSecondary = false;

      if (activeFilters['TOTAL'] !== false) {
        const validSeries = groupSeriesEur.filter(s => s !== null);
        if (validSeries.length > 0) {
          const totalSeriesEur = baseTimeline.map((_, tIdx) => validSeries.reduce((acc, s) => acc + s[tIdx], 0));
          datasets.push({ label: 'Total', data: toPercent(totalSeriesEur), rawEur: totalSeriesEur, borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0, yAxisID: 'y' });
        }
      }

      chartGroups.forEach((g, index) => {
        const key = `group-${index}`; const dataEur = groupSeriesEur[index];
        if (activeFilters[key] && dataEur !== null) {
          const isCrypto = g.id.startsWith('crypto-'); if (isCrypto) hasCryptoOnSecondary = true;
          datasets.push({ label: `${g.name} [${g.account}]`, data: toPercent(dataEur), rawEur: dataEur, borderColor: palette[(index + 1) % palette.length], borderWidth: 1.5, pointRadius: 0, yAxisID: isCrypto ? 'y1' : 'y' });
        }
      });

      const ctx = document.getElementById('portfolioChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      if (datasets.length === 0) return;

      chartInstance = new Chart(ctx, {
        type: 'line', data: { labels: baseTimeline.map(p => new Date(p.timestamp).toLocaleDateString('fr-FR', labelFormat)), datasets },
        options: {
          responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.dataset.rawEur[c.dataIndex].toLocaleString('fr-FR', {style:'currency', currency:'EUR'})}` } } },
          scales: { x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 }, maxTicksLimit: 6 } }, y: { grid: { color: '#232f48' }, ticks: { color: '#38bdf8', font: { size: 9 }, callback: (val) => `${val >= 0 ? '+' : ''}${val.toFixed(1)} %` } }, y1: { position: 'right', display: hasCryptoOnSecondary, grid: { drawOnChartArea: false }, ticks: { color: '#f59e0b', font: { size: 9 }, callback: (val) => `${val >= 0 ? '+' : ''}${val.toFixed(1)} %` } } }
        }
      });
    } finally { loadingEl.style.display = 'none'; }
  }

  renderTabs(); refreshAll();
</script>
